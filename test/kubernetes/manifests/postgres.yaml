# Postgres for the test only: one pod, no persistence. A real install points
# PANDO_DATABASE_URL at a database it backs up (design 00 §1.1).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: pando
  labels:
    app.kubernetes.io/name: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
          env:
            - name: POSTGRES_USER
              value: pando
            - name: POSTGRES_PASSWORD
              value: pando-k8s-test
            - name: POSTGRES_DB
              value: pando
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: [pg_isready, -U, pando]
            periodSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: pando
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
  namespace: pando
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: pando
              app.kubernetes.io/component: server
      ports:
        - port: 5432
